# paper-search-pro default configuration (v2.0)
# Copy to ~/.paper-search-pro/config.yaml and customize.
#
# v2.0 architecture: SKILL.md drives the workflow (recipe form). Python is
# deterministic helpers only. Budget / state machine / LLM call wrappers are
# removed — those are the Claude Code main agent's job.

# ============================================================================
# Data source credentials
# ============================================================================
#
# Each user fills their own keys. The skill is portable: no key here works for
# everyone — get your own from the issuing service (5 min each, free tier).

# --- OpenAlex (L1 primary source) ---
# OpenAlex 2026-02 switched from mailto polite pool to API key model.
# Apply at: https://openalex.org/keys  (free, $1/day quota)
# Either openalex_email OR openalex_api_key — having both is fine.
openalex_email: ""
openalex_api_key: ""

# --- Semantic Scholar (L3 enrichment: influentialCitationCount + abstract fallback) ---
# Apply at: https://www.semanticscholar.org/product/api  (free)
# Boosts rate limit from 1 RPS to 1 RPS sustained + bursts.
semantic_scholar_api_key: ""

# --- PubMed / NCBI (L2 booster: MeSH enricher) ---
# Apply at: https://account.ncbi.nlm.nih.gov/settings/  ->  API Key Management
# Both required. ncbi_email is mandatory by NCBI API ToS.
ncbi_email: ""
ncbi_api_key: ""

# --- CrossRef (L3 enrichment: funder / license / clinical-trial-number) ---
# No key required. crossref_email goes in User-Agent for polite pool (10/s × 3 conc).
crossref_email: ""

# --- arXiv (L2 booster: T-0~T-4 freshness sentinel) ---
# No key, no email. Rate-limited to 1 req per 3 s — handled by arxiv SDK.


# ============================================================================
# Output
# ============================================================================

output_dir: "./paper-search-results"
default_tier: "standard"        # quick | standard | deep | audit
language: "en"                  # en | zh — REPORT UI chrome language (auto-detected), not data. ORTHOGONAL to search_language below.


# ============================================================================
# Language routing (中文文献轨道 — additive; 留空/缺省 = auto = v2.2 行为)
# ============================================================================
# 检索的"语言空间":查英文文献、中文文献还是两者。
#   auto (factory) — 英文 query → en(与既往逐字节一致);中文 query → 按
#                    query 内显式信号走,无信号则问一次(答案可持久化到这里)。
#   en   — 永不进入中文空间;中文 query 被规划为英文检索式(会告知一行)。
#   zh   — 中文 query 走中文空间(OpenAlex 中文底座 + 学科信号路由 NSSD/yiigle)。
#   both — 中文 query 双空间并查、联邦去重。
# 注意与 `language:`(报告 UI 语言,自动检测)无关——那是"报告用什么语言说话",
# 这是"去哪片文献海里找"。旧 config 无此键 → 默认 auto → 行为不变(与
# primary_source 的 additive 先例一致)。SSOT:references/source_routing.md
# §"Language scope"。
search_language: auto            # auto | en | zh | both


# ============================================================================
# Source routing (v2.2 — additive; leave at defaults for v2.0/2.1 behavior)
# ============================================================================
# These control which source the search entry-point treats as primary. The
# defaults below reproduce the existing OpenAlex-first behavior exactly; omit
# them entirely and nothing changes.

# openalex          -> current behavior (OpenAlex primary, SS enriches)  [default]
# semantic_scholar  -> SS bulk search is primary (needs semantic_scholar_api_key)
# auto              -> start on OpenAlex; if its daily USD budget runs low,
#                      stickily fall back to SS for the rest of the run
primary_source: "openalex"

# Only relevant when primary_source == "auto". Allows the quota-driven switch.
quota_fallback: true

# USD remaining (OpenAlex X-RateLimit-Remaining-USD) at/below which "auto" mode
# switches to Semantic Scholar for the remainder of the run.
quota_fallback_threshold_usd: 0.05


# ============================================================================
# Journal rank (v2.2 Feature A — additive; omit entirely for v2.1 behavior)
# ============================================================================
# Multi-platform journal partition / quartile (CAS 中科院 / JCR / SJR). Data is
# fetched at runtime from public mirrors into cache_dir — NEVER bundled in-repo.
# CAS 区 & SJR quartile are PARTITIONS; only JCR IF(2024) is a real Impact Factor.
rank:
  # Factory default reporting standard. The skill labels every paper with all
  # three platforms but FILTERS only on this one unless a request overrides it.
  # Override per-request ("中科院一区" -> cas) is transient; this is the persistent
  # default the user can set ("以后都用 X").  jcr | cas | sjr
  default_platform: jcr
  # Where fetched ranking CSVs are cached (never the repo).
  cache_dir: ~/.paper-search-pro/ranks
  # Mirror URLs (swap to another mirror if one moves). All GitHub-raw -> plain
  # HTTP works (no Cloudflare). Leave unset to use the built-in defaults.
  sources:
    cas: "https://raw.githubusercontent.com/hitfyd/ShowJCR/master/%E4%B8%AD%E7%A7%91%E9%99%A2%E5%88%86%E5%8C%BA%E8%A1%A8%E5%8F%8AJCR%E5%8E%9F%E5%A7%8B%E6%95%B0%E6%8D%AE%E6%96%87%E4%BB%B6/FQBJCR2025-UTF8.csv"
    jcr: "https://raw.githubusercontent.com/hitfyd/ShowJCR/master/%E4%B8%AD%E7%A7%91%E9%99%A2%E5%88%86%E5%8C%BA%E8%A1%A8%E5%8F%8AJCR%E5%8E%9F%E5%A7%8B%E6%95%B0%E6%8D%AE%E6%96%87%E4%BB%B6/JCR2024-UTF8.csv"
    sjr: "https://raw.githubusercontent.com/saramabrouk173/zotero-sjr-ranker/main/scimagojr%202024.csv"
  # NOTE: no persistent tier default — tier filtering is per-request / per-explicit
  # default only (never auto-persisted from a single request).


# ============================================================================
# HTML rendering
# ============================================================================
# (No config keys here as of 2026-05-23. The Skill always uses the
#  webartifacts Shadcn React bundle; the size-driven jinja2 fallback was
#  removed for UX consistency, and the size advisory is gone too.)


# ============================================================================
# Cache
# ============================================================================

cache_enabled: true
cache_ttl_days: 7
cache_max_size_mb: 500


# ============================================================================
# Logging
# ============================================================================

log_level: "INFO"
